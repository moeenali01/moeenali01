<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 414 492" width="414" height="492" role="img"><title>Blockchain Developer Intern, Dafi Labs, Sep 2024 - Dec 2024. Engineered multi-node blockchain infrastructure with Geth and GoQuorum using Raft and Proof-of-Work consensus. Built a custom block explorer for real-time visibility into blocks, transactions, and network activity. Developed and tested smart contracts across EVM-compatible networks using industry-standard security practices. Geth, GoQuorum, Raft, Proof-of-Work, Block explorer.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="5" y="5" width="404" height="482" rx="20" fill="#0D1729" stroke="#264362"/><path d="M28 5H162" stroke="#67D7F5" stroke-width="3" stroke-linecap="round"/><circle cx="370" cy="448" r="26" fill="none" stroke="#67D7F5" stroke-opacity=".10" stroke-width="2"/><text class="m" x="31" y="48" font-size="12.5" font-weight="600" letter-spacing="1.2" fill="#8DA6BE">SEP 2024 - DEC 2024</text><text x="31" y="78" font-size="22" fill="#F3F9FF" font-weight="800">Blockchain Developer Intern</text><text x="31" y="100" font-size="15" fill="#67D7F5" font-weight="600">Dafi Labs</text><circle cx="34" cy="129" r="2.5" fill="#67D7F5"/><text x="45" y="134" font-size="14" fill="#B9CBDD" >Engineered multi-node blockchain infrastructure</text><text x="45" y="154" font-size="14" fill="#B9CBDD" >with Geth and GoQuorum using Raft and</text><text x="45" y="174" font-size="14" fill="#B9CBDD" >Proof-of-Work consensus.</text><circle cx="34" cy="196" r="2.5" fill="#67D7F5"/><text x="45" y="201" font-size="14" fill="#B9CBDD" >Built a custom block explorer for real-time visibility</text><text x="45" y="221" font-size="14" fill="#B9CBDD" >into blocks, transactions, and network activity.</text><circle cx="34" cy="24